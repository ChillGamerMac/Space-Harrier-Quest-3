<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Harrier VR</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1b0d2b">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
:root{--bg:#fff4e0;--fg:#2a1238;--ac:#e8326e;--mut:#6b5878;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b0d2b;--fg:#ffe9c7;--ac:#ff5c93;--mut:#b9a3c9}}
:root[data-theme="dark"]{--bg:#1b0d2b;--fg:#ffe9c7;--ac:#ff5c93;--mut:#b9a3c9}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:Georgia,"Times New Roman",serif}
#ui{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box}
h1{font-size:clamp(40px,10vw,84px);font-style:italic;letter-spacing:.02em;margin:0 0 12px;color:var(--ac)}
p{max-width:34em;line-height:1.55;margin:6px 0;color:var(--mut)}
button{margin:22px 0 10px;font:inherit;font-size:22px;padding:14px 34px;border:3px solid var(--ac);background:var(--ac);color:#fff;border-radius:0;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
input{font:inherit;color:var(--fg);max-width:100%}
button:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
#msg{min-height:1.5em}
</style>
</head>
<body>
<div id="ui">
  <h1>Harrier VR</h1>
  <p>A first-person rail shooter in the spirit of the arcade classic. Fly over the checkerboard, shoot the drones, dodge the columns and bushes.</p>
  <p>Thumbstick: fly. Trigger: fire where the controller points. Either hand works. Turn your head to look around, lean to dodge.</p>
  <button id="go" disabled>Enter VR</button>
  <p><label>Optional stage theme (MIDI file): <input type="file" id="mf" accept=".mid,.midi,audio/midi"></label></p>
  <p id="mm"></p>
  <p id="msg">Checking for WebXR…</p>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  var msg = function(t){ var m = document.getElementById('msg'); if (m) m.textContent = t; };
  if (typeof THREE === 'undefined') msg('The 3D library did not load from cdnjs.cloudflare.com. Check your connection or any content blocker, then reload.');
  window.addEventListener('error', function(e){ if (typeof THREE !== 'undefined') msg('Script error: ' + e.message + (e.lineno ? ' (line ' + e.lineno + ')' : '')); });
  setTimeout(function(){
    var m = document.getElementById('msg'), g = document.getElementById('go');
    if (m && /^Checking/.test(m.textContent)){
      m.textContent = 'The VR check is taking too long. You can still try Enter VR. If it fails, reload in the Meta Quest Browser.';
      if (g) g.disabled = false;
    }
  }, 4000);
})();
</script>
<script>
const T = THREE, FLOOR = -2;
const renderer = new T.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local-floor');

let SKY = 0x7fd0ff;
const scene = new T.Scene();
scene.background = new T.Color(SKY);
scene.fog = new T.Fog(SKY, 40, 150);
const camera = new T.PerspectiveCamera(70, innerWidth/innerHeight, .1, 300);
const rig = new T.Group(); rig.add(camera); scene.add(rig);
scene.add(new T.HemisphereLight(0xffffff, 0x6a4a88, 1.1));
const sun = new T.DirectionalLight(0xffffff, .8); sun.position.set(2,5,3); scene.add(sun);

// scrolling checkerboard floor
const fc = document.createElement('canvas'); fc.width = fc.height = 128;
const fg = fc.getContext('2d');
fg.fillStyle = '#e0a93a'; fg.fillRect(0,0,128,128);
fg.fillStyle = '#8a4f1a'; fg.fillRect(0,0,64,64); fg.fillRect(64,64,64,64);
const tex = new T.CanvasTexture(fc);
tex.wrapS = tex.wrapT = T.RepeatWrapping; tex.repeat.set(20,40); tex.magFilter = T.NearestFilter;
const floor = new T.Mesh(new T.PlaneGeometry(200,400), new T.MeshBasicMaterial({map:tex}));
floor.rotation.x = -Math.PI/2; floor.position.set(0,FLOOR,-150); scene.add(floor);

// controllers
const ctrls = [0,1].map(i => {
  const c = renderer.xr.getController(i);
  c.userData = {src:null, cd:0};
  c.addEventListener('connected', e => c.userData.src = e.data);
  c.addEventListener('disconnected', () => c.userData.src = null);
  c.add(new T.Line(new T.BufferGeometry().setFromPoints([new T.Vector3(), new T.Vector3(0,0,-40)]),
    new T.LineBasicMaterial({color:0xff4080})));
  c.add(new T.Mesh(new T.CylinderGeometry(.015,.02,.12,8).rotateX(Math.PI/2), new T.MeshBasicMaterial({color:0x333344})));
  const r = new T.Mesh(new T.RingGeometry(.5,.7,24), new T.MeshBasicMaterial({color:0xff4080,fog:false}));
  r.position.z = -30; c.add(r);
  rig.add(c); return c;
});

// HUD
const hc = document.createElement('canvas'); hc.width = 512; hc.height = 256;
const hg = hc.getContext('2d'); const htex = new T.CanvasTexture(hc);
const hud = new T.Mesh(new T.PlaneGeometry(2,1), new T.MeshBasicMaterial({map:htex,transparent:true,fog:false,depthTest:false}));
hud.position.set(0,2.4,-4); hud.renderOrder = 10; rig.add(hud);

let state = 'title', score = 0, top = 0, lives = 3, t = 0, inv = 0, flash = 0, overT = 0, propT = 0, enemyT = 1, stage = 1, stageClock = 0, stageT = 0, boss = null;
function drawHud(){
  hg.clearRect(0,0,512,256); hg.fillStyle = 'rgba(20,8,40,.6)'; hg.fillRect(0,0,512,256);
  hg.fillStyle = '#fff'; hg.textAlign = 'center';
  if (state === 'play' && stageT > 0){
    hg.font = 'italic bold 76px Georgia'; hg.fillText(boss ? 'WARNING' : 'STAGE ' + stage, 256, 135);
    hg.font = '30px Georgia'; hg.fillText('Score ' + score, 256, 205);
  } else if (state === 'play'){
    hg.font = 'bold 54px Georgia'; hg.fillText('SCORE ' + score, 256, 95);
    hg.fillText('LIVES ' + '\u2665'.repeat(lives), 256, 170);
    hg.font = '30px Georgia'; hg.fillText('STAGE ' + stage + '    TOP ' + top, 256, 226);
  } else {
    hg.font = 'italic bold 56px Georgia'; hg.fillText(state === 'over' ? 'GAME OVER' : 'HARRIER VR', 256, 80);
    hg.font = '32px Georgia';
    hg.fillText(state === 'over' ? 'Score ' + score : 'Stick: fly   Trigger: fire', 256, 145);
    hg.fillText('Pull a trigger to start', 256, 200);
    hg.font = '22px Georgia'; hg.fillText('A B X Y: music    Stick click: change view', 256, 240);
  }
  if (boss && !boss.dying && state === 'play'){
    hg.fillStyle = '#5a1010'; hg.fillRect(40,242,432,10);
    hg.fillStyle = '#ff4a3a'; hg.fillRect(40,242,432*Math.max(0,boss.hp)/boss.max,10);
  }
  htex.needsUpdate = true;
}

// game objects
const bullets = [], enemies = [], props = [], shots = [], fx = [];
const bGeo = new T.SphereGeometry(.12,8,6), bMat = new T.MeshBasicMaterial({color:0x66ffff});
const eGeo = new T.OctahedronGeometry(.8), eMat = new T.MeshStandardMaterial({color:0xcc33ff,flatShading:true});
const fGeo = new T.SphereGeometry(.25,8,6), fMat = new T.MeshBasicMaterial({color:0xff7a00});
const cGeo = new T.CylinderGeometry(.8,1,1,10), cMat = new T.MeshStandardMaterial({color:0xaab0c8});
const sGeo = new T.IcosahedronGeometry(1,0), sMat = new T.MeshStandardMaterial({color:0x2e9b3d,flatShading:true});
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const rnd = (a,b) => a + Math.random()*(b-a);
const cp = new T.Vector3(), q = new T.Quaternion(), dir = new T.Vector3(), pos = new T.Vector3();

function add(list, mesh, extra){ scene.add(mesh); list.push(Object.assign({m:mesh}, extra)); }
function drop(list, i){ scene.remove(list[i].m); list.splice(i,1); }
function boom(p, col){
  const m = new T.Mesh(new T.SphereGeometry(.5,10,8), new T.MeshBasicMaterial({color:col,transparent:true}));
  m.position.copy(p); add(fx, m, {life:.4}); sfx('boom');
}
function haptic(c, s, d){
  try { const a = c.userData.src.gamepad.hapticActuators; if (a && a[0]) a[0].pulse(s, d); } catch(e){}
}
function startGame(){
  [bullets,enemies,props,shots,fx].forEach(l => { while (l.length) drop(l,0); });
  if (boss){ scene.remove(boss.head); boss.segs.forEach(s => scene.remove(s)); boss = null; }
  score = 0; lives = 3; t = 0; inv = 0; propT = 0; enemyT = 1;
  rig.position.set(0,0,tp ? 7 : 0); state = 'play'; setMusic(); setStage(1);
}
function hurt(c){
  if (inv > 0 || state !== 'play') return;
  lives--; inv = 2; flash = .3; sfx('hurt');
  ctrls.forEach(k => haptic(k, 1, 250));
  if (lives <= 0){ state = 'over'; top = Math.max(top, score); overT = 1.2; setMusic(); }
  drawHud();
}
function readInput(){
  let mx = 0, my = 0, tog = false, vt = false; const fire = [];
  ctrls.forEach(c => {
    const s = c.userData.src; if (!s || !s.gamepad) return;
    const a = s.gamepad.axes, b = s.gamepad.buttons;
    const x = a.length > 3 ? a[2] : a[0], y = a.length > 3 ? a[3] : a[1];
    if (Math.abs(x) > Math.abs(mx)) mx = x;
    if (Math.abs(y) > Math.abs(my)) my = y;
    if (b[0] && b[0].pressed) fire.push(c);
    const pr = (b[4] && b[4].pressed) || (b[5] && b[5].pressed);
    if (pr && !c.userData.tp) tog = true; c.userData.tp = pr;
    const sp = b[3] && b[3].pressed;
    if (sp && !c.userData.sp) vt = true; c.userData.sp = sp;
  });
  return {mx: Math.abs(mx) > .12 ? mx : 0, my: Math.abs(my) > .12 ? my : 0, fire, tog, vt};
}

// audio: original chiptune track + sfx, all synthesized
let AC = null, mGain, sGain, nbuf, musicOn = true, step = 0, nextT = 0;
const SPS = 60/152/4, ROOTS = [45,41,48,43], MIN = [0,3,7,12], MAJ = [0,4,7,12], KIND = [MIN,MAJ,MAJ,MAJ];
const ARP = [0,1,2,3,2,1,2,3,0,1,2,3,2,1,3,2];
const HOOK = [[81,0,84,0,88,0,84,81],[77,0,81,0,84,0,81,77],[79,0,84,0,88,0,91,88],[86,0,83,0,79,0,83,86]];
const hz = n => 440*Math.pow(2,(n-69)/12);
function initAudio(){
  if (AC) return;
  AC = new (window.AudioContext || window.webkitAudioContext)();
  mGain = AC.createGain(); mGain.connect(AC.destination);
  sGain = AC.createGain(); sGain.gain.value = .5; sGain.connect(AC.destination);
  nbuf = AC.createBuffer(1, AC.sampleRate*.5, AC.sampleRate);
  const d = nbuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random()*2-1;
  nextT = AC.currentTime + .1; setMusic();
}
function setMusic(){ if (AC) mGain.gain.setTargetAtTime(musicOn ? (state === 'over' ? .1 : .3) : 0, AC.currentTime, .1); }
function tone(type, f, t0, dur, vol, dest, f2){
  const o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.setValueAtTime(f, t0);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0+dur);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.001, t0+dur);
  o.connect(g); g.connect(dest); o.start(t0); o.stop(t0+dur+.02);
}
function noise(t0, dur, vol, freq, dest){
  const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = nbuf; f.type = 'highpass'; f.frequency.value = freq;
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.001, t0+dur);
  s.connect(f); f.connect(g); g.connect(dest); s.start(t0); s.stop(t0+dur);
}
function playStep(s, t0){
  const bar = (s>>4)&3, k = s&15, r = (boss ? RB : ROOTS)[bar], ch = (boss ? KB : KIND)[bar];
  if (k%2 === 0) tone('sawtooth', hz(r + (k%4 === 2 ? 12 : 0)), t0, SPS*1.6, .5, mGain);
  tone('square', hz(r + 12 + ch[ARP[k]]), t0, SPS*.9, .13, mGain);
  const h = boss ? 0 : HOOK[bar][k>>1]; if (k%2 === 0 && h) tone('sawtooth', hz(h), t0, SPS*1.8, .12, mGain);
  if (k%4 === 0) tone('sine', 150, t0, .14, 1, mGain, 40);
  if (k === 4 || k === 12) noise(t0, .12, .5, 1500, mGain);
  if (k%4 === 2 || (boss && k%2 === 0)) noise(t0, .04, .25, 7000, mGain);
}
// optional user-supplied MIDI stage theme: loaded at runtime on the device, never bundled
let mid = null, midOn = false, midI = 0, midT0 = 0;
function parseMidi(buf){
  const d = new DataView(buf); let p = 0;
  const u32 = () => { const v = d.getUint32(p); p += 4; return v; }, u16 = () => { const v = d.getUint16(p); p += 2; return v; };
  const vq = () => { let v = 0, c; do { c = d.getUint8(p++); v = (v << 7) | (c & 127); } while (c & 128); return v; };
  if (u32() !== 0x4d546864) throw new Error('not a MIDI file');
  u32(); u16(); const n = u16(), div = u16();
  const evs = [], tempos = [[0, 500000]];
  for (let i = 0; i < n && p < d.byteLength; i++){
    if (u32() !== 0x4d54726b) break;
    const len = u32(), end = p + len; let tick = 0, run = 0; const on = {};
    while (p < end){
      tick += vq();
      const s = d.getUint8(p);
      if (s === 0xff){
        const ty = d.getUint8(p+1); p += 2; const l = vq();
        if (ty === 0x51) tempos.push([tick, (d.getUint8(p) << 16) | (d.getUint8(p+1) << 8) | d.getUint8(p+2)]);
        p += l;
      } else if (s === 0xf0 || s === 0xf7){ p++; const l = vq(); p += l; }
      else {
        if (s & 128){ run = s; p++; }
        const hi = run & 0xf0, ch = run & 15, a = d.getUint8(p++);
        if (hi === 0xc0 || hi === 0xd0) continue;
        const b = d.getUint8(p++), key = ch*128 + a;
        if (hi === 0x90 && b > 0) on[key] = [tick, b];
        else if (hi === 0x80 || hi === 0x90){ const o = on[key]; if (o){ evs.push({t0:o[0], t1:tick, n:a, v:o[1], ch}); delete on[key]; } }
      }
    }
    p = end;
  }
  tempos.sort((x, y) => x[0] - y[0]);
  const tk = t => { let s = 0, pt = 0, us = 500000; for (const [tt, u] of tempos){ if (tt >= t) break; s += (tt-pt)*us/div/1e6; pt = tt; us = u; } return s + (t-pt)*us/div/1e6; };
  const ev = evs.map(e => { const a = tk(e.t0); return {t:a, d:Math.min(2.5, Math.max(.05, tk(e.t1) - a)), n:e.n, v:e.v/127, ch:e.ch}; });
  ev.sort((a, b) => a.t - b.t);
  const last = ev[ev.length-1];
  return {ev, len: last ? last.t + last.d + .5 : 0};
}
function midiNote(e, t0){
  if (e.ch === 9){
    if (e.n === 35 || e.n === 36) tone('sine', 150, t0, .14, e.v, mGain, 40);
    else if (e.n === 38 || e.n === 40) noise(t0, .12, .5*e.v, 1500, mGain);
    else noise(t0, .04, .25*e.v, 7000, mGain);
    return;
  }
  const ty = e.ch%4 === 0 ? 'square' : e.ch%4 === 1 ? 'sawtooth' : e.n < 52 ? 'sawtooth' : 'triangle';
  tone(ty, hz(e.n), t0, e.d, .09*e.v, mGain);
}
function musicTick(){
  if (!AC) return;
  if (AC.state === 'suspended') AC.resume();
  const useMidi = !!mid && !boss;
  if (useMidi !== midOn){ midOn = useMidi; midI = 0; midT0 = AC.currentTime + .1; }
  if (useMidi){
    const now = AC.currentTime;
    while (midI < mid.ev.length && midT0 + mid.ev[midI].t < now + .25){
      const e = mid.ev[midI++], at = midT0 + e.t;
      if (musicOn && at >= now - .02) midiNote(e, Math.max(at, now));
    }
    if (midI >= mid.ev.length && now > midT0 + mid.len){ midT0 += mid.len; midI = 0; }
    return;
  }
  if (nextT < AC.currentTime) nextT = AC.currentTime + .05;
  while (nextT < AC.currentTime + .25){ if (musicOn) playStep(step, nextT); step = (step+1)&63; nextT += boss ? SPS*152/172 : SPS; }
}
function sfx(n){
  if (!AC) return; const t = AC.currentTime;
  if (n === 'shoot') tone('square', 1100, t, .07, .18, sGain, 300);
  else if (n === 'boom'){ noise(t, .3, .7, 300, sGain); tone('sawtooth', 160, t, .25, .4, sGain, 40); }
  else if (n === 'hurt') tone('sawtooth', 400, t, .5, .6, sGain, 60);
}

// enemy types and stages
const mk = (g, c, hp, pts) => ({g, m:new T.MeshStandardMaterial({color:c,flatShading:true}), hp, pts});
const E = {
  drone: mk(eGeo, 0xcc33ff, 1, 100),
  diver: mk(new T.ConeGeometry(.6,1.8,8).rotateX(Math.PI/2), 0xff3b3b, 1, 150),
  circler: mk(new T.TorusGeometry(.7,.22,8,16), 0x33e0ff, 2, 200),
  turret: mk(new T.BoxGeometry(1.4,1.4,1.4), 0xffd23a, 3, 250)
};
function spawnEnemy(){
  const r = Math.random(); let k = 'drone';
  if (stage >= 2 && r < .25) k = 'circler'; else if (stage >= 2 && r < .4) k = 'turret'; else if (r < (stage > 1 ? .7 : .4)) k = 'diver';
  const d = E[k], m = new T.Mesh(d.g, d.m);
  const x = clamp(cp.x + rnd(-8,8), -9, 9), y = k === 'turret' ? FLOOR + .7 : rnd(FLOOR+1.5, FLOOR+8);
  m.position.set(k === 'diver' ? clamp(cp.x + rnd(-3,3), -8, 8) : x, k === 'diver' ? rnd(FLOOR+5, FLOOR+9) : y, -110);
  add(enemies, m, {k, ph:rnd(0,6), fire:rnd(.5,2), bx:x, by:y, hp:d.hp, pts:d.pts, v:null});
}
function moveEnemy(e, dt, speed){
  const p = e.m.position;
  if (e.k === 'drone'){ p.z += (speed+14)*dt; p.x = e.bx + Math.sin(e.ph)*2.2; e.m.rotation.y += dt*3; e.m.rotation.x += dt*2; }
  else if (e.k === 'circler'){ p.z += (speed+4)*dt; p.x = e.bx + Math.cos(e.ph)*3; p.y = e.by + Math.sin(e.ph)*2; e.m.rotation.x += dt*4; }
  else if (e.k === 'turret'){ p.z += speed*dt; e.m.rotation.y += dt; }
  else if (!e.v){ p.z += (speed+14)*dt; if (p.z > -60){ e.v = cp.clone().sub(p).normalize().multiplyScalar(48); e.m.lookAt(cp); } }
  else p.addScaledVector(e.v, dt);
}
const STG = [[0x7fd0ff,'#e0a93a','#8a4f1a'],[0xff9a6a,'#8a3fb0','#43195f'],[0x6a86ff,'#3ac0a0','#1c5a4c'],[0x2a1550,'#ff3b8a','#40104a']];
function setStage(n){
  stage = n; stageClock = 0; stageT = 3.5;
  const s = STG[(n-1) % STG.length]; SKY = s[0]; scene.fog.color.set(SKY); scene.background.set(SKY);
  fg.fillStyle = s[1]; fg.fillRect(0,0,128,128); fg.fillStyle = s[2]; fg.fillRect(0,0,64,64); fg.fillRect(64,64,64,64);
  tex.needsUpdate = true; drawHud();
}

// serpent boss
const RB = [45,45,41,44], KB = [MIN,MIN,MAJ,MAJ];
const bodyA = new T.MeshStandardMaterial({color:0x2fbf6a,flatShading:true}), bodyB = new T.MeshStandardMaterial({color:0x1f8a4c,flatShading:true});
function bossPos(tt, out){
  const en = Math.min(Math.max(0, 1 - tt/2.5), 1.6)*85;
  return out.set(6*Math.sin(tt*.9), FLOOR + 4.5 + 2.5*Math.sin(tt*1.3+1), -45 + 6*Math.sin(tt*.6) - en);
}
function spawnBoss(){
  const head = new T.Mesh(new T.IcosahedronGeometry(1.8,1), new T.MeshStandardMaterial({color:0xff4a3a,flatShading:true}));
  [-.8,.8].forEach(x => { const e = new T.Mesh(new T.SphereGeometry(.35,8,6), new T.MeshBasicMaterial({color:0xffee33})); e.position.set(x,.5,1.5); head.add(e); });
  scene.add(head);
  const segs = [];
  for (let i = 0; i < 14; i++){
    const r = 1.4 - i*.06, s = new T.Mesh(new T.SphereGeometry(r,10,8), i%2 ? bodyA : bodyB);
    s.userData.r = r; scene.add(s); segs.push(s);
  }
  const hp = 60 + 25*(stage-1);
  boss = {head, segs, t:0, hp, max:hp, fire:2.5, flash:0, dying:0, ex:0};
  bossPos(0, head.position); stageT = 3; drawHud();
}
function killBoss(){
  boss.dying = 1; boss.ex = 0; score += 1500*stage;
  while (shots.length) drop(shots, 0);
  sfx('boom'); drawHud();
}
function bossHit(bp){
  if (!boss || boss.dying) return false;
  if (bp.distanceTo(boss.head.position) < 2.4){
    boss.hp--; boss.flash = .08; ctrls.forEach(c => haptic(c, .4, 30));
    if (boss.hp <= 0) killBoss(); else drawHud();
    return true;
  }
  return boss.segs.some(s => bp.distanceTo(s.position) < s.userData.r + .3);
}
function updateBoss(dt){
  if (!boss) return;
  const b = boss; b.t += dt;
  bossPos(b.t, b.head.position);
  b.segs.forEach((s,i) => { bossPos(b.t - (i+1)*.14, s.position); s.position.y += .5*Math.sin(i + b.t*3); });
  b.flash -= dt; b.head.material.emissive.setHex(b.flash > 0 ? 0xaa4444 : 0);
  if (b.dying){
    b.ex -= dt;
    if (b.ex <= 0){
      b.ex = .12;
      if (b.segs.length){ const s = b.segs.pop(); boom(s.position, 0xffaa33); scene.remove(s); }
      else { boom(b.head.position, 0xffee66); scene.remove(b.head); boss = null; setStage(stage + 1); }
    }
    return;
  }
  if (state !== 'play') return;
  if (b.t > 2.5){
    b.fire -= dt;
    if (b.fire <= 0){
      b.fire = Math.max(.8, 1.6 - stage*.15);
      for (const a of [-1,0,1]){
        const f = new T.Mesh(fGeo, fMat); f.position.copy(b.head.position);
        add(shots, f, {d: cp.clone().sub(b.head.position).normalize().add(new T.Vector3(a*.18,0,0)).normalize()});
      }
    }
  }
  if (b.head.position.distanceTo(cp) < 2.6) hurt();
}

// third-person view: pilot avatar, ground shadow
let tp = false;
const tg = new T.Vector3(), tm = new T.Vector3(), tm2 = new T.Vector3();
const avatar = new T.Group(); scene.add(avatar); avatar.visible = false;
const am = c => new T.MeshStandardMaterial({color:c, flatShading:true});
const part = (g, c, x, y, z) => { const m = new T.Mesh(g, am(c)); m.position.set(x,y,z); avatar.add(m); return m; };
part(new T.BoxGeometry(.5,.32,.9), 0x2a6fdb, 0,0,0);
part(new T.SphereGeometry(.2,10,8), 0xf2c9a0, 0,.1,-.55);
part(new T.BoxGeometry(.16,.16,.7), 0xe8e8f0, -.12,0,.75);
part(new T.BoxGeometry(.16,.16,.7), 0xe8e8f0, .12,0,.75);
const cannon = new T.Mesh(new T.CylinderGeometry(.08,.08,1.1,8).rotateX(Math.PI/2).translate(0,0,-.55), am(0x888899));
cannon.position.set(.3,-.1,-.2); avatar.add(cannon);
const shadow = new T.Mesh(new T.CircleGeometry(.7,16).rotateX(-Math.PI/2), new T.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.35}));
scene.add(shadow);
function setView(on){ tp = on; rig.position.z = on ? 7 : 0; }
function updateAvatar(inp, dt){
  shadow.position.set(cp.x, FLOOR + .03, cp.z); shadow.scale.setScalar(Math.max(.4, 1 - (cp.y - FLOOR)/12));
  avatar.visible = tp && (inv <= 0 || state !== 'play' || Math.floor(t*12) % 2 === 0);
  if (!tp) return;
  avatar.position.copy(cp);
  const k = Math.min(1, dt*8);
  avatar.rotation.z += (-inp.mx*.6 - avatar.rotation.z)*k;
  avatar.rotation.x += (-inp.my*.4 - avatar.rotation.x)*k;
  const c = ctrls.find(x => x.userData.src);
  if (c){ c.getWorldPosition(pos); c.getWorldQuaternion(q); dir.set(0,0,-1).applyQuaternion(q); tg.copy(pos).addScaledVector(dir, 40); }
  else tg.set(cp.x, cp.y, -40);
  avatar.updateMatrixWorld(true);
  cannon.getWorldPosition(tm); tm2.copy(tm).multiplyScalar(2).sub(tg); cannon.lookAt(tm2);
}

let last = 0;
renderer.setAnimationLoop(now => {
  const dt = Math.min((now - last)/1000 || 0, .05); last = now;
  const inp = readInput();
  if (inp.tog){ musicOn = !musicOn; setMusic(); }
  if (inp.vt) setView(!tp);
  musicTick();
  const speed = state === 'play' ? 30 + (stage-1)*4 + Math.min(stageClock,40)*.1 : 12;
  tex.offset.y += speed*dt/10;

  if (state === 'play'){
    t += dt; inv -= dt; stageClock += dt;
    if (stageClock > 40 && !boss) spawnBoss();
    if (stageT > 0 && (stageT -= dt) <= 0) drawHud();
    rig.position.x = clamp(rig.position.x + inp.mx*dt*9, -6, 6);
    rig.position.y = clamp(rig.position.y - inp.my*dt*7, -1.4, 3.5);
  } else {
    overT -= dt;
    if (inp.fire.length && overT <= 0){ startGame(); }
  }
  rig.updateMatrixWorld(true);
  camera.getWorldPosition(cp);
  if (tp) cp.set(rig.position.x, rig.position.y + 1.1, 0);
  updateAvatar(inp, dt);

  // firing
  ctrls.forEach(c => {
    c.userData.cd -= dt;
    if (state === 'play' && inp.fire.includes(c) && c.userData.cd <= 0){
      c.userData.cd = .11;
      c.getWorldPosition(pos); c.getWorldQuaternion(q);
      dir.set(0,0,-1).applyQuaternion(q);
      if (tp){ tg.copy(pos).addScaledVector(dir, 40); pos.copy(cp); dir.copy(tg).sub(cp).normalize(); }
      const m = new T.Mesh(bGeo, bMat); m.position.copy(pos);
      add(bullets, m, {d:dir.clone(), life:1.6});
      haptic(c, .15, 20); sfx('shoot');
    }
  });

  if (state === 'play'){
    // spawn
    propT -= dt; enemyT -= dt;
    if (propT <= 0){
      propT = rnd(.25,.6)*30/speed*1.3;
      const col = Math.random() < .5, h = col ? rnd(3,8) : 1.3;
      const m = new T.Mesh(col ? cGeo : sGeo, col ? cMat : sMat);
      if (col) m.scale.set(1,h,1); else m.scale.setScalar(1.3);
      m.position.set(rnd(-14,14), FLOOR + (col ? h/2 : 1), -130);
      add(props, m, {r: col ? 1 : 1.3, top: FLOOR + h});
    }
    if (enemyT <= 0){
      enemyT = Math.max(.45, 1.4 - (stage-1)*.15 - stageClock/150); if (!boss) spawnEnemy();
    }
  }

  // props
  for (let i = props.length-1; i >= 0; i--){
    const p = props[i]; p.m.position.z += speed*dt;
    const z = p.m.position.z;
    if (state === 'play' && Math.abs(z) < .9 && Math.abs(p.m.position.x - cp.x) < p.r + .35 && cp.y < p.top + .3) hurt();
    if (z > (tp ? 4 : 8)) drop(props, i);
  }
  // enemies
  for (let i = enemies.length-1; i >= 0; i--){
    const e = enemies[i]; e.ph += dt*2;
    moveEnemy(e, dt, speed);
    e.fire -= dt;
    if (state === 'play' && e.fire <= 0 && e.k !== 'diver' && e.m.position.z < -25 && e.m.position.z > -90){
      e.fire = rnd(1.5,3) * (e.k === 'circler' ? .6 : 1);
      const f = new T.Mesh(fGeo, fMat); f.position.copy(e.m.position);
      add(shots, f, {d: cp.clone().sub(e.m.position).normalize()});
    }
    if (state === 'play' && e.m.position.distanceTo(cp) < 1.2){ boom(e.m.position, 0xffaa00); drop(enemies, i); hurt(); continue; }
    if (e.m.position.z > (tp ? 4 : 6)) drop(enemies, i);
  }
  updateBoss(dt);
  // enemy fireballs
  for (let i = shots.length-1; i >= 0; i--){
    const s = shots[i]; s.m.position.addScaledVector(s.d, 26*dt);
    if (state === 'play' && s.m.position.distanceTo(cp) < .55){ drop(shots, i); hurt(); continue; }
    if (s.m.position.z > (tp ? 4 : 8)) drop(shots, i);
  }
  // player bullets
  for (let i = bullets.length-1; i >= 0; i--){
    const b = bullets[i]; b.m.position.addScaledVector(b.d, 90*dt); b.life -= dt;
    let hit = false;
    for (let j = enemies.length-1; j >= 0; j--){
      const en = enemies[j];
      if (b.m.position.distanceTo(en.m.position) < 1.2){
        hit = true; en.hp--; ctrls.forEach(c => haptic(c, .5, 40));
        if (en.hp <= 0){ boom(en.m.position, 0xffee66); drop(enemies, j); if (state === 'play'){ score += en.pts; drawHud(); } }
        break;
      }
    }
    if (!hit && bossHit(b.m.position)) hit = true;
    if (hit || b.life <= 0) drop(bullets, i);
  }
  // effects
  for (let i = fx.length-1; i >= 0; i--){
    const f = fx[i]; f.life -= dt; f.m.scale.addScalar(dt*8); f.m.material.opacity = Math.max(f.life/.4, 0);
    if (f.life <= 0) drop(fx, i);
  }
  flash -= dt; scene.background.set(flash > 0 ? 0xff4040 : SKY);
  renderer.render(scene, camera);
});

// session handling
const ui = document.getElementById('ui'), go = document.getElementById('go'), msg = document.getElementById('msg');
if (navigator.xr){
  navigator.xr.isSessionSupported('immersive-vr').then(ok => {
    msg.textContent = ok ? 'Ready.' : 'Immersive VR is not available here. Open this page in the Meta Quest Browser.';
    go.disabled = !ok;
    // Installed Quest app (TWA): start VR straight away; the app-icon tap is the user activation
    const installed = 'getDigitalGoodsService' in window || matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches;
    if (ok && installed) go.onclick();
  }).catch(() => msg.textContent = 'Could not check WebXR support.');
} else msg.textContent = 'WebXR is not available here. Open this page in the Meta Quest Browser.';
go.onclick = async () => {
  try {
    initAudio();
    const s = await navigator.xr.requestSession('immersive-vr', {optionalFeatures:['local-floor']});
    s.addEventListener('end', () => { ui.style.display = 'flex'; });
    await renderer.xr.setSession(s);
    ui.style.display = 'none'; state = 'title'; overT = .5; drawHud();
  } catch(e){ msg.textContent = 'Could not start VR: ' + e.message; }
};
document.getElementById('mf').onchange = async e => {
  const f = e.target.files[0], m = document.getElementById('mm'); if (!f) return;
  try {
    const r = parseMidi(await f.arrayBuffer()); if (!r.ev.length) throw new Error('no notes found');
    mid = r; m.textContent = 'Loaded ' + f.name + ' (' + Math.round(r.len) + ' s). It plays during stages; bosses keep their own music.';
  } catch(err){ mid = null; m.textContent = 'Could not read that file: ' + err.message; }
};
addEventListener('resize', () => { if (!renderer.xr.isPresenting){ camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight);} });
drawHud();
</script>
